<template>
    <lightning-card title="Organizer Performance Console" icon-name="standard:dashboard">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-gutters">
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-theme_alt-inverse slds-text-align_center">
                        <p class="slds-text-heading_small">Active Events</p>
                        <h2 class="slds-text-heading_large">{totalEvents}</h2>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-theme_success slds-text-align_center">
                        <p class="slds-text-heading_small">Total Revenue</p>
                        <h2 class="slds-text-heading_large">${totalRevenue}</h2>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-theme_warning slds-text-align_center">
                        <p class="slds-text-heading_small">Total Seats Sold</p>
                        <h2 class="slds-text-heading_large">{totalSeatsSold}</h2>
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-4">
                    <div class="slds-box slds-theme_info slds-text-align_center">
                        <p class="slds-text-heading_small">Avg Rating</p>
                        <h2 class="slds-text-heading_large">4.8 / 5.0</h2>
                    </div>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
