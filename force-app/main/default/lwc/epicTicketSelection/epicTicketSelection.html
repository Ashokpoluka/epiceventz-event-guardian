<template>
    <lightning-card title="Select Tickets & Checkout" icon-name="custom:custom14">
        <div class="slds-p-around_medium">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Processing..." size="medium"></lightning-spinner>
            </template>

            <template if:true={ticketTypes}>
                <div class="slds-m-bottom_medium">
                    <p class="slds-text-heading_small">Choose your ticket tier:</p>
                </div>
                <template for:each={ticketTypes} for:item="ticket">
                    <div key={ticket.Id} class="slds-box slds-m-bottom_small slds-grid slds-grid_vertical-align-center">
                        <div class="slds-col slds-size_1-of-2">
                            <h3 class="slds-text-heading_small">{ticket.Name}</h3>
                            <p class="slds-text-color_weak">Price: ${ticket.Price__c} | Remaining: {ticket.Remaining_Quantity__c}</p>
                        </div>
                        <div class="slds-col slds-size_1-of-2 slds-text-align_right">
                            <lightning-button 
                                variant="brand" 
                                label="Select Tier" 
                                data-id={ticket.Id} 
                                data-price={ticket.Price__c}
                                onclick={handleSelectTier}>
                            </lightning-button>
                        </div>
                    </div>
                </template>
            </template>

            <template if:true={selectedTicketId}>
                <div class="slds-box slds-theme_shade slds-m-top_medium">
                    <p class="slds-text-heading_small">Selected Tier Total: ${calculatedTotal}</p>
                    <lightning-button 
                        class="slds-m-top_small" 
                        variant="success" 
                        label="Complete Checkout ($)" 
                        onclick={handleCheckout}>
                    </lightning-button>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
